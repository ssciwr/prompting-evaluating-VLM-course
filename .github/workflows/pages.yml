name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install nbconvert
        run: pip install nbconvert

      - name: Convert notebooks to Markdown pages
        run: |
          set -euo pipefail
          git ls-files '*.ipynb' | while read -r nb; do
            jupyter nbconvert --to markdown "$nb"
            md="${nb%.ipynb}.md"
            title="$(basename "${nb%.ipynb}")"
            # Front matter so Jekyll applies the theme layout; raw block so
            # notebook content is never interpreted as Liquid.
            {
              printf -- '---\ntitle: %s\n---\n\n' "$title"
              printf -- '[Download notebook](%s)\n\n' "$(basename "$nb")"
              echo '{% raw %}'
              cat "$md"
              echo '{% endraw %}'
            } > "$md.tmp"
            mv "$md.tmp" "$md"
          done

      - name: Point README notebook links at rendered pages
        run: sed -i -E 's/\(([^)]*)\.ipynb\)/(\1.html)/g' README.md

      - uses: actions/configure-pages@v5

      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
